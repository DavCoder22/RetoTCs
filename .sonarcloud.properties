# SonarQube Cloud automatic analysis configuration (default branch: main)
# Boilerplate data/plumbing layers produce incidental copy-paste (DTOs, JPA
# mappers, annotated controllers). Business logic in services/domain remains
# fully analyzed. See: https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis
sonar.cpd.exclusions=**/dto/**,**/persistence/**,**/domain/entity/**,**/error/**,**/config/**,**/controller/**,**/enums/**,**/ai/config/**