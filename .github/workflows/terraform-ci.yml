name: terraform

on:
  workflow_dispatch:
  pull_request:
    paths: [terraform/**, .github/workflows/terraform-ci.yml]
  push:
    branches: [develop, main]
    paths: [terraform/**, .github/workflows/terraform-ci.yml]

env:
  TF_IN_AUTOMATION: "true"

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    name: terraform plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - name: inspect OIDC token claims
        run: |
          TOKEN=$(curl -sSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c "import json,sys;print(json.load(sys.stdin)['value'])")
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2)
          PAD=$(( (4 - ${#PAYLOAD} % 4) % 4 ))
          PAYLOAD="$PAYLOAD$(printf '=%.0s' $(seq 1 $PAD))"
          echo "== claims =="; echo "$PAYLOAD" | tr '_-' '/+' | base64 -d 2>/dev/null | python3 -m json.tool

      - name: configure AWS (OIDC)
        id: aws
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          audience: sts.amazonaws.com

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: terraform init
        if: ${{ steps.aws.outcome == 'success' }}
        run: terraform init

      - name: terraform validate
        if: ${{ steps.aws.outcome == 'success' }}
        run: terraform validate

      - name: terraform plan
        if: ${{ steps.aws.outcome == 'success' }}
        run: |
          terraform plan \
            -var-file=terraform.tfvars.example \
            -out=tfplan