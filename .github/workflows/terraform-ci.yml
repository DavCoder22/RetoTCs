name: terraform deploy

# Despliega SmartBancs en AWS con Terraform (EC2 + docker compose):
#   1) plan (PR / push a main)      -> terraform init/validate/plan
#   2) deploy (push a main o manual) -> crea bucket de estado + ECR, construye y
#       sube imágenes, empaqueta el bundle compose, y terraform apply.
# OPENROUTER_API_KEY se inyecta desde el secret del repo (nunca se imprime):
#   Settings -> Secrets and variables -> Actions -> OPENROUTER_API_KEY

on:
  workflow_dispatch:
    inputs:
      destroy:
        description: "Ejecutar terraform destroy (apaga la EC2) tras el apply"
        type: boolean
        default: false
  pull_request:
    paths:
      - "terraform/**"
      - "deploy/**"
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - ".github/workflows/terraform-ci.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "deploy/**"
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - ".github/workflows/terraform-ci.yml"

env:
  TF_IN_AUTOMATION: "true"
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  STATE_BUCKET: "smartbancs-tfstate"
  TF_KEY: "reto-tcs/terraform.tfstate"

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    name: terraform plan
    runs-on: ubuntu-latest
    if: ${{ vars.AWS_ROLE_ARN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: ensure state bucket + lock table
        run: |
          aws s3api create-bucket --bucket "${STATE_BUCKET}" --region "${AWS_REGION}" >/dev/null 2>&1 \
            || aws s3api create-bucket --bucket "${STATE_BUCKET}" --region "${AWS_REGION}" \
               --create-bucket-configuration LocationConstraint="${AWS_REGION}" >/dev/null 2>&1 || true
          aws dynamodb create-table \
            --table-name terraform-locks \
            --attribute-definitions AttributeName=LockID,AttributeType=S \
            --key-schema AttributeName=LockID,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST >/dev/null 2>&1 || true

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: terraform init (backend s3)
        working-directory: terraform
        run: |
          terraform init -backend=true \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=${TF_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=terraform-locks" \
            -input=false -no-color

      - name: terraform validate
        working-directory: terraform
        run: terraform validate -no-color

      - name: terraform plan
        working-directory: terraform
        run: |
          terraform plan \
            -var-file=terraform.tfvars.example \
            -var="openrouter_api_key=" \
            -out=tfplan -no-color

  deploy:
    name: deploy EC2 (ECR + terraform apply)
    needs: plan
    if: >-
      ${{ vars.AWS_ROLE_ARN != '' &&
          (github.event_name == 'push' && github.ref == 'refs/heads/main'
           || github.event_name == 'workflow_dispatch') }}
    env:
      TF_VAR_openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY && secrets.OPENROUTER_API_KEY || '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: ensure state bucket + lock table
        run: |
          aws s3api create-bucket --bucket "${STATE_BUCKET}" --region "${AWS_REGION}" >/dev/null 2>&1 \
            || aws s3api create-bucket --bucket "${STATE_BUCKET}" --region "${AWS_REGION}" \
               --create-bucket-configuration LocationConstraint="${AWS_REGION}" >/dev/null 2>&1 || true
          aws dynamodb create-table \
            --table-name terraform-locks \
            --attribute-definitions AttributeName=LockID,AttributeType=S \
            --key-schema AttributeName=LockID,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST >/dev/null 2>&1 || true

      - name: ensure ECR repos
        run: |
          aws ecr create-repository --repository-name smartbancs-api --region "${AWS_REGION}" >/dev/null 2>&1 || true
          aws ecr create-repository --repository-name smartbancs-ai-service --region "${AWS_REGION}" >/dev/null 2>&1 || true

      - name: build + push imágenes (api, ai-service)
        run: |
          account="$(aws sts get-caller-identity --query Account --output text)"
          registry="${account}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${registry}" >/dev/null
          docker compose build api ai-service
          docker tag smartbancs-api:latest "${registry}/smartbancs-api:latest"
          docker tag smartbancs-ai-service:latest "${registry}/smartbancs-ai-service:latest"
          docker push "${registry}/smartbancs-api:latest"
          docker push "${registry}/smartbancs-ai-service:latest"

      - name: empaqueta bundle de despliegue (compose + observability)
        run: |
          tar --exclude='.git' -czf /tmp/deploy-bundle.tar.gz \
            docker-compose.yml docker-compose.prod.yml observability
          aws s3 cp /tmp/deploy-bundle.tar.gz \
            "s3://${STATE_BUCKET}/deploy/deploy-bundle.tar.gz" --region "${AWS_REGION}"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: terraform init (backend s3)
        working-directory: terraform
        run: |
          terraform init -backend=true \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=${TF_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=terraform-locks" \
            -input=false -no-color

      - name: terraform apply
        if: ${{ github.event.inputs.destroy != 'true' }}
        working-directory: terraform
        run: |
          terraform apply \
            -var-file=terraform.tfvars.example \
            -auto-approve -input=false -no-color

      - name: terraform destroy (manual)
        if: ${{ github.event.inputs.destroy == 'true' }}
        working-directory: terraform
        run: |
          terraform destroy \
            -var-file=terraform.tfvars.example \
            -auto-approve -input=false -no-color

      - name: urls de la demo
        run: terraform output