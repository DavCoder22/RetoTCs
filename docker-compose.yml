name: smartbancs

services:
  postgres:
    image: postgres:16-alpine
    container_name: smartbancs-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartbancs}
      POSTGRES_USER: ${POSTGRES_USER:-smartbancs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartbancs}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartbancs} -d ${POSTGRES_DB:-smartbancs}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: smartbancs-api/Dockerfile
      network: host
    container_name: smartbancs-api
    depends_on:
      postgres:
        condition: service_healthy
      tempo:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-smartbancs}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-smartbancs}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-smartbancs}
      OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
      AI_SERVICE_URL: http://ai-service:8081
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
      network: host
    container_name: smartbancs-ai-service
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-moonshotai/kimi-k2.6}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u;u.urlopen('http://localhost:8081/health', timeout=3) or None"]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: smartbancs-postgres-exporter
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-smartbancs}:${POSTGRES_PASSWORD:-smartbancs}@postgres:5432/${POSTGRES_DB:-smartbancs}?sslmode=disable
    ports:
      - "9187:9187"

  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: smartbancs-prometheus
    depends_on:
      api:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  tempo:
    image: grafana/tempo:2.6.1
    container_name: smartbancs-tempo
    command: ['-config.file=/etc/tempo.yml']
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"

  loki:
    image: grafana/loki:3.3.2
    container_name: smartbancs-loki
    command: ['-config.file=/etc/loki-config.yml']
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  promtail:
    image: grafana/promtail:3.3.2
    container_name: smartbancs-promtail
    depends_on:
      loki:
        condition: service_healthy
    volumes:
      - ./observability/promtail/promtail.yml:/etc/promtail/config.yml:ro
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - ${DOCKER_CONTAINERS_DIR:-/var/lib/docker/containers}:/var/lib/docker/containers:ro

  grafana:
    image: grafana/grafana:11.4.0
    container_name: smartbancs-grafana
    depends_on:
      - prometheus
      - tempo
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_HOST_PORT:-3333}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_HOST_PORT:-3333}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  tempo-data:
  loki-data:
  grafana-data: